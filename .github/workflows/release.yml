name: Create release and upload models

on:
  push:
    tags:
      - 'release-*'

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository (with LFS)
        uses: actions/checkout@v4
        with:
          lfs: true

      - name: Create GitHub Release
        id: create_release
        uses: actions/create-release@v1
        with:
          tag_name: ${{ github.ref_name }}
          release_name: ${{ github.ref_name }}
          body: "Automated release containing model assets (uploaded from LFS)."

      - name: Upload CNN model
        uses: actions/upload-release-asset@v1
        with:
          upload_url: ${{ steps.create_release.outputs.upload_url }}
          asset_path: CNN_module/cnn_model.pth
          asset_name: cnn_model.pth
          asset_content_type: application/octet-stream

      - name: Upload Transformer model
        uses: actions/upload-release-asset@v1
        with:
          upload_url: ${{ steps.create_release.outputs.upload_url }}
          asset_path: Transformer_module/transformer_model.pth
          asset_name: transformer_model.pth
          asset_content_type: application/octet-stream

      - name: Upload RF model
        uses: actions/upload-release-asset@v1
        with:
          upload_url: ${{ steps.create_release.outputs.upload_url }}
          asset_path: rf_email_spam_model.pkl
          asset_name: rf_email_spam_model.pkl
          asset_content_type: application/octet-stream
